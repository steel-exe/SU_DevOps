[library_servers]
# Host IP from Terraform output (matching Om Tambe's verification IP: 98.92.102.185)
library-host ansible_host=98.92.102.185 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/library-aws-key

[library_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
app_port=5000
nginx_port=80
container_name=library-app
image_name=library-platform:v1.0.0
