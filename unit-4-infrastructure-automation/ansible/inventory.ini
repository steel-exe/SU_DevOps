# =============================================================================
# Ansible Static Inventory Configuration
# Enterprise Student Record & Academic Management Platform (SU_DevOps)
# =============================================================================

[academic_servers]
# Replace YOUR_EC2_PUBLIC_IP with the output from `terraform output -raw ec2_public_ip`
student-app-node ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/student-aws-key.pem

[academic_servers:vars]
# Standardized Python interpreter and SSH resilience parameters
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
app_container_name=student-academic-api
app_image_name=student-academic-platform:latest
app_port=5000
nginx_http_port=80
