---
# =============================================================================
# Ansible Orchestration Playbook: Enterprise Student Platform Deployment
# Configures Ubuntu 22.04 LTS host: Docker CE, Nginx Reverse Proxy, and App
# Implements Idempotent Multi-Tier Execution & 4-Gate Validation Checks
# =============================================================================

- name: Deploy and Configure Student Record & Academic Management Platform
  hosts: academic_servers
  become: true
  vars:
    app_root_dir: /opt/student_platform
    app_port: 5000
    nginx_port: 80
    container_name: student-academic-api
    image_name: student-academic-platform:latest

  tasks:
    # -------------------------------------------------------------------------
    # Tier 1: Baseline System Utilities & Prerequisites
    # -------------------------------------------------------------------------
    - name: Ensure APT package cache is updated
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required core system utilities and certificates
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - jq
          - ca-certificates
          - gnupg
          - lsb-release
          - software-properties-common
          - python3-pip
          - python3-setuptools
        state: present

    # -------------------------------------------------------------------------
    # Tier 2: Docker CE Installation & Service Configuration
    # -------------------------------------------------------------------------
    - name: Create secure directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download official Docker GPG signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Add Docker official repository to APT sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE, CLI, and Containerd packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu system user to docker security group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install Docker SDK for Python (required for Ansible docker modules)
      ansible.builtin.pip:
        name: docker
        state: present

    # -------------------------------------------------------------------------
    # Tier 3: Application Deployment & Container Orchestration
    # -------------------------------------------------------------------------
    - name: Create application root directory
      ansible.builtin.file:
        path: "{{ app_root_dir }}"
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Copy Unit 3 Application source code to target server
      ansible.builtin.copy:
        src: ../../unit-3-application-development/
        dest: "{{ app_root_dir }}/"
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Build Docker container image locally on host
      community.docker.docker_image:
        name: "{{ image_name }}"
        build:
          path: "{{ app_root_dir }}"
          pull: true
        source: build
        state: present

    - name: Run Student Academic Management API Docker container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        published_ports:
          - "127.0.0.1:{{ app_port }}:5000"
        env:
          PORT: "5000"
          ENVIRONMENT: "production"
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 5s

    # -------------------------------------------------------------------------
    # Tier 4: Nginx Reverse Proxy Installation & Upstream Routing
    # -------------------------------------------------------------------------
    - name: Install Nginx web server
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy custom Nginx reverse proxy configuration
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/student_platform.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
              listen {{ nginx_port }} default_server;
              listen [::]:{{ nginx_port }} default_server;
              server_name _;

              client_max_body_size 16M;

              # Proxy requests to backend Gunicorn Flask container
              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 60s;
                  proxy_read_timeout 60s;
                  proxy_buffering on;
              }

              # Dedicated Nginx health check endpoint
              location /nginx-health {
                  access_log off;
                  return 200 "Nginx reverse proxy operational\n";
                  add_header Content-Type text/plain;
              }
          }
      notify: Reload Nginx

    - name: Disable default Nginx configuration
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Enable student platform Nginx site configuration
      ansible.builtin.file:
        src: /etc/nginx/sites-available/student_platform.conf
        dest: /etc/nginx/sites-enabled/student_platform.conf
        state: link
      notify: Reload Nginx

    - name: Ensure Nginx service is running and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    # -------------------------------------------------------------------------
    # Tier 5: Post-Deployment Four Validation Gates (Smoke Tests)
    # -------------------------------------------------------------------------
    - name: Flush handlers to ensure Nginx reloaded before validation
      ansible.builtin.meta: flush_handlers

    - name: "Gate 1: Verify local network socket listening on Port {{ nginx_port }}"
      ansible.builtin.wait_for:
        port: "{{ nginx_port }}"
        timeout: 30

    - name: "Gate 2: Verify Docker container status is healthy"
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }} .State.Status {{ '}}' }}' {{ container_name }}"
      register: container_status
      changed_when: false
      failed_when: "'running' not in container_status.stdout"

    - name: "Gate 3: Validate API health endpoint via Nginx reverse proxy (/api/health)"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port }}/api/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_response
      retries: 5
      delay: 3
      until: health_response.status == 200 and health_response.json.status == "UP"

    - name: "Gate 4: Validate student records retrieval (/api/students)"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port }}/api/students"
        method: GET
        status_code: 200
      register: students_response

    - name: Display deployment success confirmation summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "🎉 DEPLOYMENT SUCCEEDED & VERIFIED!"
          - "Service Status: {{ health_response.json.status }}"
          - "Registered Students Count: {{ health_response.json.total_students }}"
          - "Nginx Reverse Proxy: Active on Port {{ nginx_port }}"
          - "Container: {{ container_name }} (Running)"
          - "=========================================================="

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
